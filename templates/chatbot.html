<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodMeal AI Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}" />
</head>
<body>
  <div class="page-shell chatbot-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">M</div>
        <div class="brand-text">MoodMeal AI</div>
      </div>

      <nav class="navlinks">
        <a href="/">Home</a>
        <a href="/chatbot">AI Chat</a>
        <a href="/history">History</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
        <a class="nav-btn btn-link" href="/">Home</a>
      </div>
    </header>

    <main class="chatbot-card reveal-on-scroll">
      <div class="chat-header">
        <span class="mini-label">AI assistant</span>
        <h2>Ask about your meal</h2>
      </div>

      <div class="chat-window" id="chatWindow">
        <div class="chat-bubble bot">Hi! Tell me how you feel or what you want to eat.</div>
      </div>

      <div class="chat-form-row">
        <input id="chatInput" type="text" placeholder="Ask me for meal ideas..." />
        <button id="sendChat" class="primary-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script>
    const chatWindow = document.getElementById('chatWindow');
    const chatInput = document.getElementById('chatInput');
    const sendChat = document.getElementById('sendChat');

    function appendMessage(text, isBot = false) {
      const div = document.createElement('div');
      div.className = 'chat-bubble ' + (isBot ? 'bot' : 'user');
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      appendMessage(message, false);
      chatInput.value = '';

      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      appendMessage(data.reply, true);
    }

    sendChat.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
